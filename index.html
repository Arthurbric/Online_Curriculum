<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arthur Arash Briceño Heidari</title>
    <meta name="description" content="Arquiteto de Soluções e Pré-vendas Técnicas em Cloud (GCP) e IA Generativa.">
    <link rel="icon" href="/img/award.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('aa-theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    <div class="bg-grid" aria-hidden="true"></div>
    <div class="bg-glow" aria-hidden="true"></div>

    <!-- ============ SIDEBAR / TOPO ============ -->
    <header class="rail">
        <a class="rail__brand" href="#top">
            <span class="rail__dot" aria-hidden="true"></span>
            <span class="rail__initials" data-slot="initials"></span>
        </a>

        <nav class="rail__nav" aria-label="Navegação principal">
            <ul data-slot="nav"></ul>
        </nav>

        <div class="rail__tools">
            <button class="chipbtn" id="langBtn" type="button" aria-label="Mudar idioma">
                <span data-slot="langLabel">EN</span>
            </button>
            <button class="chipbtn chipbtn--icon" id="themeBtn" type="button" aria-label="Alternar tema">
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4.2" />
                    <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" />
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.3 8.3 0 1 0 10.2 10.2Z" />
                </svg>
            </button>
            <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main id="main">
        <!-- ============ HERO ============ -->
        <section class="hero" id="top">
            <div class="wrap">
                <div class="hero__panel glass">
                    <div class="hero__left">
                        <p class="term" aria-hidden="true">
                            <span class="term__prompt">~/portfolio</span>
                            <span class="term__cmd">whoami</span>
                        </p>

                        <h1 class="hero__name" data-slot="name"></h1>

                        <p class="hero__role">
                            <span class="hero__caret">&gt;</span>
                            <span class="hero__rotator" data-slot="rotator" aria-live="polite"></span>
                        </p>

                        <p class="hero__sum" data-slot="summary"></p>

                        <div class="hero__cta">
                            <a class="btn btn--solid" href="#projects" data-slot="ctaPrimary"></a>
                            <a class="btn btn--ghost" id="resumeLink" href="#" download data-slot="ctaSecondary"></a>
                        </div>

                        <ul class="hero__links" data-slot="links"></ul>
                    </div>

                    <div class="hero__right">
                        <div class="avatar">
                            <img data-slot="photo" src="" alt="" width="360" height="360" loading="eager">
                            <span class="avatar__ring" aria-hidden="true"></span>
                        </div>
                        <dl class="stats" data-slot="stats"></dl>
                    </div>
                </div>

                <div class="ticker" aria-hidden="true">
                    <div class="ticker__track" data-slot="ticker"></div>
                </div>
            </div>
        </section>

        <!-- ============ EXPERIÊNCIA ============ -->
        <section class="section" id="experience">
            <div class="wrap">
                <div class="shead">
                    <span class="shead__tag">01 / exp</span>
                    <h2 data-slot="sec-experience"></h2>
                    <span class="shead__rule" aria-hidden="true"></span>
                </div>

                <div class="track" data-slot="experience"></div>

                <div class="other">
                    <button class="disclosure" id="otherBtn" type="button" aria-expanded="false" aria-controls="otherPanel">
                        <span class="disclosure__sign" aria-hidden="true"></span>
                        <span data-slot="otherToggle"></span>
                    </button>
                    <div class="other__panel" id="otherPanel" hidden>
                        <p class="other__note" data-slot="otherNote"></p>
                        <div class="other__grid" data-slot="otherExperience"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ============ COMPETÊNCIAS ============ -->
        <section class="section" id="skills">
            <div class="wrap">
                <div class="shead">
                    <span class="shead__tag">02 / stack</span>
                    <h2 data-slot="sec-skills"></h2>
                    <span class="shead__rule" aria-hidden="true"></span>
                </div>

                <div class="board">
                    <div class="panel glass panel--wide">
                        <h3 class="panel__title" data-slot="sec-competencies"></h3>
                        <div class="cloud" data-slot="competencies"></div>
                    </div>

                    <div class="panel glass panel--radar">
                        <h3 class="panel__title" data-slot="sec-languages"></h3>
                        <div class="radar" data-slot="radar"></div>
                        <ul class="radar__legend" data-slot="radarLegend"></ul>
                    </div>
                </div>

                <div class="stackgrid" data-slot="skills"></div>
            </div>
        </section>

        <!-- ============ PROJETOS ============ -->
        <section class="section" id="projects">
            <div class="wrap">
                <div class="shead">
                    <span class="shead__tag">03 / repos</span>
                    <h2 data-slot="sec-projects"></h2>
                    <span class="shead__rule" aria-hidden="true"></span>
                </div>
                <div class="repos" data-slot="projects"></div>
            </div>
        </section>

        <!-- ============ CERTIFICAÇÕES ============ -->
        <section class="section" id="certifications">
            <div class="wrap">
                <div class="shead">
                    <span class="shead__tag">04 / creds</span>
                    <h2 data-slot="sec-certifications"></h2>
                    <span class="shead__rule" aria-hidden="true"></span>
                </div>

                <div class="edu" data-slot="education"></div>
                <div class="certs" data-slot="certifications"></div>
                <p class="courses" data-slot="otherCourses"></p>
            </div>
        </section>
    </main>

    <!-- ============ CONTATO ============ -->
    <footer class="footer" id="contact">
        <div class="wrap">
            <div class="panel glass footer__panel">
                <span class="shead__tag">05 / contact</span>
                <h2 class="footer__title" data-slot="sec-contact"></h2>
                <p class="footer__lead" data-slot="contactLead"></p>
                <a class="footer__mail" id="mailLink" href="#"></a>
                <ul class="footer__links" data-slot="footerLinks"></ul>
            </div>
            <p class="footer__note">
                <span data-slot="footerNote"></span>
                <a href="#top" data-slot="backToTop"></a>
            </p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
